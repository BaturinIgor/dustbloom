# XcodeGen spec. The .xcodeproj is generated, never committed:
#   brew install xcodegen && cd client && xcodegen generate
name: Dustbloom
options:
  developmentLanguage: en
  bundleIdPrefix: game.dustbloom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  # rewarded video (shop: golden hour for a short video) and the GDPR consent form
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  Dustbloom:
    type: application
    platform: iOS
    dependencies:
      # analytics + player feedback; GoogleService-Info.plist lives only on the Mac (gitignored)
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    sources:
      - path: Dustbloom
      # single source of truth for balance, shared with the Go server
      - path: ../server/internal/game/data/crops.json
        buildPhase: resources
      # Farm Defense economy, tuned by server/cmd/balance-sim
      - path: ../server/internal/defense/balance.json
        buildPhase: resources
    entitlements:
      path: Dustbloom/Dustbloom.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Dustbloom/Info.plist
      properties:
        CFBundleDisplayName: DUSTBLOOM
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [en, ru, de, fr, es, it, pt-BR, nl, pl, tr, uk, ja, ko, zh-Hans, zh-Hant, ar, th, vi, id, sv]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Tiny5.ttf, Rubik-Bold.ttf]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # AdMob app id; Google's test id until the real DUSTBLOOM app is created in AdMob
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # rewarded ad unit for App Store builds; empty = no ads in release (debug/TestFlight use Google's test unit)
        AdMobRewardedUnit: ""
        NSUserTrackingUsageDescription: Your data will be used to show you more relevant ads.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
