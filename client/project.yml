    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DustbloomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DustbloomTests]
    dependencies:
      - target: Dustbloom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests
schemes:
  Dustbloom:
    build:
      targets:
        Dustbloom: all
        DustbloomTests: [test]
    run:
      config: Debug
      environmentVariables:
        # leave empty to play offline; set to http://localhost:8080 to use the dev server
        DUSTBLOOM_SERVER_URL: ""
    test:
      config: Debug
      targets: [DustbloomTests]
    archive:
      config: Release
